name: dependabot-auto-merge
# Auto-merge Dependabot PRs once every required check has passed. main
# now has real branch protection (6 required status checks split across
# the `ci` and `docker` workflows — see ci.yml and docker.yml) — this
# listens for EITHER workflow to complete and attempts a merge each
# time. Whichever of the two finishes last is the one that actually
# succeeds; an attempt while the other is still pending is rejected by
# GitHub itself and treated as expected, not a failure (see the
# if/else below).
on:
  workflow_run:
    workflows: ["ci", "docker"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the PR if all required checks passed and it's a non-major bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,title --jq '.[0] // empty')
          [ -n "$pr" ] || { echo "no open PR for $BRANCH"; exit 0; }
          num=$(echo "$pr" | jq -r .number); title=$(echo "$pr" | jq -r .title)
          from=$(echo "$title" | sed -nE 's/.* from ([0-9]+)\.[0-9].* to .*/\1/p')
          to=$(echo "$title"   | sed -nE 's/.* to ([0-9]+)\.[0-9].*/\1/p')
          if [ -z "$from" ] || [ -z "$to" ]; then echo "unparseable title, manual: $title"; exit 0; fi
          if [ "$from" != "$to" ]; then echo "major bump $from->$to, manual: $title"; exit 0; fi
          if gh pr merge "$num" --repo "$REPO" --squash --delete-branch; then
            echo "merged #$num: $title"
          else
            echo "merge not accepted yet for #$num (other required checks likely still pending) -- the workflow that finishes last will retry this"
          fi
