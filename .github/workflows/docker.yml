name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Default: content negotiation + bulk export only, no chit or
          # anacrolix/torrent dependency — matches `make build`.
          - tags: ""
            image_suffix: ""
          # Full: payments (x402) and torrent (BEP-19) compiled in —
          # matches `make build-full`.
          - tags: "payments,torrent"
            image_suffix: "-full"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tag history

      - name: Compute version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Pick tag channel
        id: channel
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            TAGS=${{ matrix.tags }}
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.channel.outputs.value }}${{ matrix.image_suffix }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}${{ matrix.image_suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Reverse proxy implementing the four robots.yes pillars
            org.opencontainers.image.licenses=MIT
