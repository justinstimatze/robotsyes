name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Default: content negotiation + bulk export only, no chit or
          # anacrolix/torrent dependency — matches `make build`.
          - tags: ""
            image_suffix: ""
          # Full: payments (x402) and torrent (BEP-19) compiled in —
          # matches `make build-full`.
          - tags: "payments,torrent"
            image_suffix: "-full"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tag history

      - name: Compute version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Pick tag channel
        id: channel
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      # No registry login on a PR run — it only builds and scans, never
      # pushes, so there's nothing to authenticate for.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            TAGS=${{ matrix.tags }}
            VERSION=${{ steps.version.outputs.value }}
          tags: robotsyes:scan

      # Scans the image actually built, not just the base tag Dependabot
      # tracks — catches vulnerable OS packages pulled in between base
      # image releases. ignore-unfixed: failing on a CVE with no
      # available fix yet just blocks every build until upstream
      # patches, for no gain.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: robotsyes:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            TAGS=${{ matrix.tags }}
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.channel.outputs.value }}${{ matrix.image_suffix }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}${{ matrix.image_suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Reverse proxy implementing the four robots.yes pillars
            org.opencontainers.image.licenses=MIT
