name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Checkout and the Go toolchain are all this needs; anything more is a token
# handed to every action in the job for no reason.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -l found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -v ./cmd/robotsyes

  # The default build excludes payments and torrent (see cmd/robotsyes's
  # payments_stub.go / internal/export's torrent_stub.go) so a plain
  # `go install` never links in chit or anacrolix/torrent. This job is
  # what actually exercises the code those build tags gate — without it,
  # chitgate's proxy integration and torrent.go would have zero CI
  # coverage.
  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test (payments, torrent)
        run: go test -race -tags payments,torrent ./...
      - name: Build (payments, torrent)
        run: go build -v -tags payments,torrent ./cmd/robotsyes

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint (default)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: Lint (payments, torrent)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --build-tags=payments,torrent

  # govulncheck checks reachable calls into known-vulnerable symbols, not
  # just "is a dependency old" — the gap that let the toolchain drift six
  # patches behind (20 stdlib CVEs) with nothing catching it. Two runs
  # for the same reason test/test-full is split: chit and
  # anacrolix/torrent are only in the dependency graph under
  # payments,torrent, so the default run can't see vulnerabilities
  # reachable only through them.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck (default)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: govulncheck (payments, torrent)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -tags payments,torrent ./...
